<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba — Motor de loop</title>
<style>
    body { margin:0; font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; overflow:hidden; }
    #escena { position:fixed; inset:0; }
    #fondo { position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(.9) saturate(1.05); }
    #cinta  { position:absolute; bottom:0; left:0; right:0; height:110px; background:rgba(0,0,0,.55); padding:10px 14px; box-sizing:border-box; }
    #barra  { position:relative; height:6px; background:rgba(255,255,255,.15); border-radius:3px; margin-bottom:12px }
    #prog   { position:absolute; top:0; left:0; height:6px; width:0; background:#f0b429; border-radius:3px }
    #chiche { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:34px; font-weight:700;
              color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.85); opacity:0; transition:opacity .25s; text-align:center; max-width:80%; pointer-events:none }
    #meta   { position:absolute; top:0; left:0; right:0; padding:14px 18px; background:linear-gradient(180deg,rgba(0,0,0,.6),transparent) }
    #meta h1 { margin:0; font-size:15px; font-weight:600; color:#8fcb46 }
    #meta p  { margin:2px 0 0; font-size:12px; color:#cfd8e3 }
    #controles { position:absolute; top:14px; right:18px; display:flex; gap:8px; align-items:center }
    button { background:#222831; color:#e6edf3; border:1px solid #3a4250; border-radius:6px; padding:6px 14px; font-size:13px; cursor:pointer }
    button:hover { background:#2a3342 }
    #cinta small { color:#9aa7b8; font-size:11px }
    #chip { margin:0; font-size:12px; color:#8fcb46; font-weight:500 }
</style>
</head>
<body>
<div id="escena">
    <div id="fondo"></div>
    <div id="meta">
        <h1>Prueba — Motor de loop (spec.json)</h1>
        <p id="chip">Cargando spec…</p>
    </div>
    <div id="controles">
        <span id="reloj" style="font-size:13px;color:#e6edf3"></span>
        <button id="btn" onclick="toggle()">▶ Reproducir</button>
    </div>
    <div id="chiche"></div>
    <div id="cinta">
        <div id="barra"><div id="prog"></div></div>
        <small id="info"></small>
    </div>
</div>
<script>
'use strict';
var SPEC = null;          // spec.json
var ACTIVO = null;        // medio actual
var INICIO = 0;
var RUNNING = false;
var RAF = null;

function $(id){ return document.getElementById(id); }

function cargar(){
    fetch('api/loop.php')
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(s => {
            SPEC = s;
            $('chip').textContent = '✓ Spec cargada: ' + s.medios.length + ' medios · '
                + s.chiches.length + ' chiches · ' + s.loop_secs + ' s';
            // Ordenar por t_loop para búsqueda lineal eficiente
            SPEC.medios.sort(function(a, b){ return a.t_loop - b.t_loop; });
            SPEC.chiches.sort(function(a, b){ return a.t - b.t; });
        })
        .catch(e => { $('chip').textContent = '⚠ Error cargando spec.json: ' + e.message; });
}

// Devuelve el medio con el mayor t_loop <= t (el que está "en pantalla").
function medioEn(t){
    var lo = 0, hi = SPEC.medios.length - 1, best = null;
    while (lo <= hi){
        var mid = (lo + hi) >> 1;
        if (SPEC.medios[mid].t_loop <= t){ best = SPEC.medios[mid]; lo = mid + 1; }
        else { hi = mid - 1; }
    }
    return best;
}

function render(t){
    var dur = SPEC.loop_secs;

    // Barra de progreso
    $('prog').style.width = (t / dur * 100) + '%';
    $('reloj').textContent = t.toFixed(1) + ' / ' + dur + ' s';

    // Medio activo
    var med = medioEn(t);
    if (med && med !== ACTIVO){
        ACTIVO = med;
        if (med.tipo === 'image'){
            $('fondo').style.backgroundImage = "url('api/servir_medio.php?id=" + med.media_id + "')";
        } else {
            $('fondo').style.backgroundImage = '';
            // videos/audios: mostramos solo el dato (prueba simple)
        }
    }
    if (med){
        $('info').textContent =
            '#id ' + med.media_id +
            ' · ' + (med.tipo || '') +
            ' · ' + (med.municipio || '') +
            (med.color ? ' · ' + med.color : '') +
            (med.tags && med.tags.length ? ' · ' + med.tags.slice(0,3).join(', ') : '') +
            ' · t=' + med.t_loop.toFixed(0) + 's';
    } else {
        $('info').textContent = 't=' + t.toFixed(1) + 's (sin medio en este instante)';
    }

    // Chiches: cruza el umbral → flash
    for (var i = 0; i < SPEC.chiches.length; i++){
        var c = SPEC.chiches[i];
        if (c.t <= t && c.t > t - 0.7){   // aparece al cruzar
            mostrarChiche(c.texto);
        }
    }
}

function mostrarChiche(texto){
    $('chiche').textContent = texto;
    $('chiche').style.opacity = '1';
    setTimeout(function(){ $('chiche').style.opacity = '0'; }, 1800);
}

function toggle(){
    if (!SPEC){ alert('Spec aún no cargada'); return; }
    RUNNING = !RUNNING;
    $('btn').textContent = RUNNING ? '⏸ Pausa' : '▶ Reproducir';
    if (RUNNING){
        INICIO = performance.now();
        loop();
    } else {
        if (raf) cancelAnimationFrame(raf);
    }
}

function loop(){
    var t = (performance.now() - INICIO) / 1000;
    var dur = SPEC.loop_secs;
    if (t > dur){
        t = 0;
        INICIO = performance.now();
    }
    render(t);
    raf = requestAnimationFrame(loop);
}

window.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); toggle(); }
});

cargar();
</script>
</body>
</html>
